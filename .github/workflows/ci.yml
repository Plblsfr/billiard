name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: billard-anglais:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name billard --read-only --tmpfs /tmp --cap-drop ALL -p 8080:8080 billard-anglais:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q '<title>Billard anglais</title>'
          curl -fsSI http://localhost:8080/ | grep -qi 'content-security-policy'
          js=$(curl -fsS http://localhost:8080/ | grep -o '/assets/[a-f0-9]*/js/main.js')
          curl -fsSI "http://localhost:8080$js" | grep -qi 'immutable'
          docker logs billard
